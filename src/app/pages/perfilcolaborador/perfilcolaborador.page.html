<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil del Colaborador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="colaborador-container">

    <ion-card>
      <ion-card-header>
        <ion-card-title>Bienvenido</ion-card-title>
        <ion-card-subtitle>Selecciona una opción</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-button expand="block" shape="round" >//(click)="irTableros()">
          Mis Tableros
        </ion-button>

        <ion-button expand="block" shape="round" >//(click)="irTareas()">
          Tareas Pendientes
        </ion-button>

        <ion-button expand="block" fill="clear" >//(click)="volverLogin()">
          Volver al Login
        </ion-button>
      </ion-card-content>

    </ion-card>
  </div>
</ion-content>
