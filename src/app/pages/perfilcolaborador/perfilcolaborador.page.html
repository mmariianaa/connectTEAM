<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil del Colaborador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <!-- Panel izquierdo -->
      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Panel de Opciones</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <!-- Campo para agregar código -->
            <ion-item>
              <ion-label position="stacked">Agregar Código</ion-label>
              <ion-input [(ngModel)]="codigoInput" placeholder="Escribe tu código aquí"></ion-input>
            </ion-item>

            <!-- Botón para unirse -->
            <ion-button expand="block" color="primary" (click)="unirmePorCodigo()">Unirme</ion-button>

            <!-- Contenedor dinámico de tableros -->
            <h3 style="margin-top: 16px;">Mis tableros</h3>
            <div #misTablerosContainer></div>

            <!-- Botón volver -->
            <ion-button expand="block" color="medium" (click)="volver()">Volver</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Panel derecho -->
      <ion-col size="12" size-md="8">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Actividades Asignadas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div #misTareasContainer></div>
          </ion-card-content>

        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
