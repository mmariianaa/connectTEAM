<ion-header>
  <ion-toolbar color="primary">
    <ion-title>CONNECT-TEAM</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="person-circle-outline"></ion-icon>
        <span style="margin-left: 8px;">Mariana Martinez</span>
      </ion-button>
      <ion-button>
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <!-- Menú lateral -->
      <ion-col size="12" size-md="3">
        <ion-list>
          <ion-item button color="primary" (click)="abrirCrearTablero()">
            <ion-label>Tableros</ion-label>
          </ion-item>
          <ion-item button>
            <ion-label>Comunicación</ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
