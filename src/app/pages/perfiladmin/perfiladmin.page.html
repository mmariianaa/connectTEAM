<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Botón para crear nuevo tablero -->
  <ion-list>
    <ion-item button color="primary" (click)="crearTablero()">
      <ion-label>Nuevo Tablero</ion-label>
    </ion-item>
  </ion-list>

  <!-- Contenedor donde se insertarán los tableros -->
  <div #tablerosContainer></div>
</ion-content>
