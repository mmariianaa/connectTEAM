<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Botón para crear nuevo tablero -->
  <ion-list>
    <ion-item button color="primary" (click)="crearTablero()">
      <ion-label>Nuevo Tablero</ion-label>
    </ion-item>
  </ion-list>

  <!-- Lista de tableros creados -->
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let tablero of tableros">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{ tablero.titulo }}</ion-card-title>
            <ion-card-subtitle>Código: {{ tablero.codigo }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            Este tablero fue creado por el administrador.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
