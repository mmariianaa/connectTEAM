<!--tareas pendientes del admin, ver el progreso de los colaboradores-->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Detalle del Tablero</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-grid>
    <ion-row>

      <!-- COLUMNA IZQUIERDA: COLABORADORES -->
      <ion-col size="4" class="panel-izquierdo">

        <ion-item button (click)="verMonica()">
          <ion-label>Monica</ion-label>

        </ion-item>

        <ion-item button (click)="verDario()">
          <ion-label>Dario</ion-label>
        </ion-item>

        <ion-item button (click)="verEmily()">
          <ion-label>Emily</ion-label>
        </ion-item>

      </ion-col>

      <!-- COLUMNA DERECHA: RESULTADOS -->
      <ion-col size="8" class="panel-derecho">

        <!-- MONICA -->
        <ion-card [class.hidden]="!mostrarMonica" class="animacion">
          <ion-card-header>
            <ion-card-title>Desempeño de Monica</ion-card-title>
          </ion-card-header>

          <ion-card-content>


            
            <ion-item><!---->
              <ion-label [class.tachado]="monicaT1">
                ✅ Tarea 1: Completa
              </ion-label>
              <ion-icon name="trash-outline" class="icono-borrar" (click)="borrarMonicaT1()"></ion-icon>
            </ion-item><!---->
            <ion-item>
              <ion-label [class.tachado]="monicaT2"><!---->
                ⏳ Tarea 2: Pendiente
              </ion-label>
              <ion-icon name="trash-outline" class="icono-borrar" (click)="borrarMonicaT2()"></ion-icon>
            </ion-item><!---->



            <p>📎 Archivo: Subido</p>
          </ion-card-content>
        </ion-card>

        <!-- DARIO -->
        <ion-card [class.hidden]="!mostrarDario" class="animacion">
          <ion-card-header>
            <ion-card-title>Desempeño de Dario</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p>✅ Tarea 1: Completa</p>
            <p>✅ Tarea 2: Completa</p>
            <p>📎 Archivo: Subido</p>
          </ion-card-content>
        </ion-card>

        <!-- EMILY -->
        <ion-card [class.hidden]="!mostrarEmily" class="animacion">
          <ion-card-header>
            <ion-card-title>Desempeño de Emily</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p>⏳ Tarea 1: Pendiente</p>
            <p>⏳ Tarea 2: Pendiente</p>
            <p>📎 Archivo: No subido</p>
          </ion-card-content>
        </ion-card>

      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
