<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="admin-container">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Administrador</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="6">
        <ion-button expand="block" (click)="crearTableros()">Crear Tableros</ion-button>
        <ion-button expand="block" (click)="misTablerosasignartareas()">Mis Tableros</ion-button>
        <ion-button expand="block" (click)="tareasPendientes()">Tareas Pendientes</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
